
<div class="container mt-5">
  <div class="row">
    <div class="col-md-6">

      <h2>Login</h2>

   
      <form [formGroup]="FormInput" (ngSubmit)="Login()">

           <input type="email" class="form-control mb-3" placeholder="Email"  formControlName="Username">

      <input type="password" class="form-control mb-3" placeholder="Password" formControlName="Password">

      <button type="submit" class="btn btn-primary" >
        Login
      </button>


      </form>
    </div>
  </div>
</div>
